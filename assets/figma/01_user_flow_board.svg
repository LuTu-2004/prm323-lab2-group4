<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1050" width="1440" height="1050">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .header-title { font-family: 'Inter', sans-serif; font-size: 26px; font-weight: 700; fill: #0F172A; }
      .header-sub { font-family: 'Inter', sans-serif; font-size: 14px; fill: #475569; }
      .flow-title { font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 700; fill: #1E293B; }
      .node-text { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; fill: #0F172A; }
      .node-sub { font-family: 'Inter', sans-serif; font-size: 10px; fill: #64748B; }
      .branch-tag { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; }
      .arrow-blue { stroke: #2563EB; stroke-width: 2; fill: none; marker-end: url(#ah-blue); }
      .arrow-purple { stroke: #7C3AED; stroke-width: 2; fill: none; marker-end: url(#ah-purple); }
      .arrow-green { stroke: #16A34A; stroke-width: 2; fill: none; marker-end: url(#ah-green); }
      .arrow-red { stroke: #DC2626; stroke-width: 2; fill: none; marker-end: url(#ah-red); }
      .arrow-gray { stroke: #64748B; stroke-width: 2; fill: none; marker-end: url(#ah-gray); }
    </style>
    <marker id="ah-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB" />
    </marker>
    <marker id="ah-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7C3AED" />
    </marker>
    <marker id="ah-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16A34A" />
    </marker>
    <marker id="ah-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626" />
    </marker>
    <marker id="ah-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B" />
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="1050" class="bg"/>

  <!-- Page Header -->
  <text x="50" y="50" class="header-title">01. KIẾN TRÚC USER FLOWS - HỆ THỐNG EXE MATCH</text>
  <text x="50" y="74" class="header-sub">Chuẩn Rubric: Mỗi flow có Bắt đầu, Mục tiêu, Kết thúc, Nhánh thành công (Happy Path) &amp; Nhánh thay thế (Alternative Branch)</text>

  <!-- ==================== FLOW 1 ==================== -->
  <g transform="translate(50, 100)">
    <rect width="1340" height="280" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="280" rx="4" fill="#2563EB"/>
    <text x="24" y="32" class="flow-title">FLOW 1: Ứng viên tìm kiếm &amp; Xin gia nhập nhóm khởi nghiệp</text>
    <text x="24" y="52" class="header-sub">🎯 Mục tiêu: Tìm nhóm EdTech phù hợp để nộp đơn ứng tuyển HOẶC lưu lại để xem xét đối sánh sau</text>

    <!-- Start -->
    <rect x="24" y="115" width="180" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="36" y="140" class="node-text" fill="#2563EB">[BẮT ĐẦU]</text>
    <text x="36" y="158" class="node-sub">SCR-02: Lướt Feed &amp; lọc EdTech</text>

    <!-- Arrow 1 -> 2 -->
    <path d="M 204 145 L 244 145" class="arrow-blue"/>

    <!-- Screen Detail -->
    <rect x="254" y="115" width="190" height="60" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="266" y="140" class="node-text">Xem chi tiết nhóm</text>
    <text x="266" y="158" class="node-sub">SCR-04: Đọc Tech Stack &amp; slot</text>

    <!-- Arrow 2 -> Decision -->
    <path d="M 444 145 L 484 145" class="arrow-blue"/>

    <!-- Decision Diamond -->
    <polygon points="545,115 605,145 545,175 485,145" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <text x="545" y="142" font-family="'Inter'" font-size="10px" font-weight="700" fill="#0F172A" text-anchor="middle">Hành động</text>
    <text x="545" y="154" font-family="'Inter'" font-size="9px" fill="#64748B" text-anchor="middle">của ứng viên?</text>

    <!-- Branch A: HAPPY PATH (Top path) -->
    <path d="M 545 115 L 545 95 L 635 95" class="arrow-blue"/>
    <rect x="550" y="75" width="85" height="18" rx="4" fill="#DBEAFE"/>
    <text x="555" y="88" class="branch-tag" fill="#1D4ED8">HAPPY PATH</text>

    <rect x="645" y="65" width="200" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="657" y="90" class="node-text" fill="#1D4ED8">Ứng tuyển ngay</text>
    <text x="657" y="108" class="node-sub">SCR-06: Form Pitch &amp; chọn Role</text>

    <path d="M 845 95 L 885 95" class="arrow-blue"/>
    <rect x="895" y="65" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="907" y="90" class="node-text">Nộp đơn thành công</text>
    <text x="907" y="108" class="node-sub">SCR-04 (Sub): Mã đơn #7842</text>

    <path d="M 1095 95 L 1135 95" class="arrow-blue"/>
    <rect x="1145" y="65" width="175" height="60" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="1157" y="90" class="node-text" fill="#16A34A">[KẾT THÚC CHÍNH]</text>
    <text x="1157" y="108" class="node-sub">SCR-07: Đơn chờ duyệt</text>

    <!-- Branch B: ALTERNATIVE BRANCH (Bottom path) -->
    <path d="M 545 175 L 545 210 L 635 210" class="arrow-purple"/>
    <rect x="550" y="215" width="125" height="18" rx="4" fill="#F3E8FF"/>
    <text x="555" y="228" class="branch-tag" fill="#7C3AED">NHÁNH THAY THẾ</text>

    <rect x="645" y="180" width="200" height="60" rx="10" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="657" y="205" class="node-text" fill="#7C3AED">Chưa muốn nộp ngay</text>
    <text x="657" y="223" class="node-sub">Bấm icon Bookmark để lưu</text>

    <path d="M 845 210 L 885 210" class="arrow-purple"/>
    <rect x="895" y="180" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="907" y="205" class="node-text">Toast thông báo lưu</text>
    <text x="907" y="223" class="node-sub">"Đã lưu vào mục quan tâm"</text>

    <path d="M 1095 210 L 1135 210" class="arrow-purple"/>
    <rect x="1145" y="180" width="175" height="60" rx="10" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="1157" y="205" class="node-text" fill="#7C3AED">[KẾT THÚC PHỤ]</text>
    <text x="1157" y="223" class="node-sub">Lưu trong Saved Ventures</text>
  </g>

  <!-- ==================== FLOW 2 ==================== -->
  <g transform="translate(50, 410)">
    <rect width="1340" height="280" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="280" rx="4" fill="#0D9488"/>
    <text x="24" y="32" class="flow-title">FLOW 2: Trưởng nhóm xem xét đơn ứng tuyển &amp; Phản hồi kết quả</text>
    <text x="24" y="52" class="header-sub">🎯 Mục tiêu: Đánh giá năng lực ứng viên và quyết định KẾT NẠP hoặc TỪ CHỐI lịch sự kèm lưu vào Talent Pool</text>

    <!-- Start -->
    <rect x="24" y="115" width="180" height="60" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
    <text x="36" y="140" class="node-text" fill="#0D9488">[BẮT ĐẦU]</text>
    <text x="36" y="158" class="node-sub">SCR-09: Thông báo đơn mới</text>

    <path d="M 204 145 L 244 145" class="arrow-gray"/>

    <!-- Screen Profile -->
    <rect x="254" y="115" width="190" height="60" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="266" y="140" class="node-text">Xem hồ sơ ứng viên</text>
    <text x="266" y="158" class="node-sub">SCR-05: GitHub, CV &amp; Commit</text>

    <path d="M 444 145 L 484 145" class="arrow-gray"/>

    <!-- Decision -->
    <polygon points="545,115 605,145 545,175 485,145" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <text x="545" y="142" font-family="'Inter'" font-size="10px" font-weight="700" fill="#0F172A" text-anchor="middle">Đánh giá</text>
    <text x="545" y="154" font-family="'Inter'" font-size="9px" fill="#64748B" text-anchor="middle">kỹ năng &amp; fit?</text>

    <!-- Branch A: HAPPY PATH (Top path) -->
    <path d="M 545 115 L 545 95 L 635 95" class="arrow-green"/>
    <rect x="550" y="75" width="85" height="18" rx="4" fill="#DCFCE7"/>
    <text x="555" y="88" class="branch-tag" fill="#16A34A">HAPPY PATH</text>

    <rect x="645" y="65" width="200" height="60" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="657" y="90" class="node-text" fill="#16A34A">Hồ sơ đạt yêu cầu</text>
    <text x="657" y="108" class="node-sub">Bấm 'Chấp nhận kết nạp'</text>

    <path d="M 845 95 L 885 95" class="arrow-green"/>
    <rect x="895" y="65" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
    <text x="907" y="90" class="node-text">Xác nhận Dialog</text>
    <text x="907" y="108" class="node-sub">Cập nhật sĩ số nhóm lên 4/5</text>

    <path d="M 1095 95 L 1135 95" class="arrow-green"/>
    <rect x="1145" y="65" width="175" height="60" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="1157" y="90" class="node-text" fill="#16A34A">[KẾT THÚC CHÍNH]</text>
    <text x="1157" y="108" class="node-sub">SCR-08: Thành viên gia nhập</text>

    <!-- Branch B: ALTERNATIVE BRANCH (Bottom path) -->
    <path d="M 545 175 L 545 210 L 635 210" class="arrow-gray"/>
    <rect x="550" y="215" width="125" height="18" rx="4" fill="#F1F5F9"/>
    <text x="555" y="228" class="branch-tag" fill="#475569">NHÁNH THAY THẾ</text>

    <rect x="645" y="180" width="200" height="60" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="657" y="205" class="node-text">Chưa phù hợp đề tài</text>
    <text x="657" y="223" class="node-sub">Bấm 'Từ chối' kèm lời nhắn</text>

    <path d="M 845 210 L 885 210" class="arrow-gray"/>
    <rect x="895" y="180" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="907" y="205" class="node-text">Lưu vào Talent Pool</text>
    <text x="907" y="223" class="node-sub">Dự phòng cho giai đoạn 2</text>

    <path d="M 1095 210 L 1135 210" class="arrow-gray"/>
    <rect x="1145" y="180" width="175" height="60" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
    <text x="1157" y="205" class="node-text" fill="#475569">[KẾT THÚC PHỤ]</text>
    <text x="1157" y="223" class="node-sub">Đơn đóng lịch sự</text>
  </g>

  <!-- ==================== FLOW 3 ==================== -->
  <g transform="translate(50, 720)">
    <rect width="1340" height="300" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="300" rx="4" fill="#DC2626"/>
    <text x="24" y="32" class="flow-title">FLOW 3: Lọc không có kết quả &amp; Phục hồi tìm kiếm (Error &amp; Recovery Branch)</text>
    <text x="24" y="52" class="header-sub">🎯 Mục tiêu: Xử lý tình huống lỗi không có kết quả tìm kiếm và phục hồi trải nghiệm bằng 2 nhánh thoát</text>

    <!-- Start -->
    <rect x="24" y="125" width="200" height="60" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="36" y="150" class="node-text" fill="#DC2626">[BẮT ĐẦU]</text>
    <text x="36" y="168" class="node-sub">SCR-02: Lọc 'Quantum NLP Rust'</text>

    <path d="M 224 155 L 264 155" class="arrow-red"/>

    <!-- Error Screen -->
    <rect x="274" y="120" width="250" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <rect x="286" y="130" width="95" height="18" rx="4" fill="#FEE2E2"/>
    <text x="290" y="143" class="branch-tag" fill="#DC2626">NHÁNH LỖI</text>
    <text x="286" y="165" class="node-text" fill="#991B1B">SCR-08: Empty State</text>
    <text x="286" y="180" class="node-sub">"No matching projects found"</text>

    <!-- Recovery Fork -->
    <!-- Recovery 1 (Top path) -->
    <path d="M 524 140 L 580 140 L 580 95 L 635 95" class="arrow-green"/>
    <rect x="585" y="75" width="135" height="18" rx="4" fill="#DCFCE7"/>
    <text x="590" y="88" class="branch-tag" fill="#16A34A">PHỤC HỒI 1 (RESET)</text>

    <rect x="645" y="65" width="200" height="60" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="657" y="90" class="node-text" fill="#16A34A">Bấm nút 'Reset Filters'</text>
    <text x="657" y="108" class="node-sub">Hệ thống xóa bộ lọc về mặc định</text>

    <path d="M 845 95 L 885 95" class="arrow-green"/>
    <rect x="895" y="65" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
    <text x="907" y="90" class="node-text">Tải lại danh sách</text>
    <text x="907" y="108" class="node-sub">SCR-02: 18 nhóm đang mở tuyển</text>

    <path d="M 1095 95 L 1135 95" class="arrow-green"/>
    <rect x="1145" y="65" width="175" height="60" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="1157" y="90" class="node-text" fill="#16A34A">[KẾT THÚC PHỤC HỒI 1]</text>
    <text x="1157" y="108" class="node-sub">Tiếp tục duyệt danh sách</text>

    <!-- Recovery 2 (Bottom path) -->
    <path d="M 524 170 L 580 170 L 580 220 L 635 220" class="arrow-blue"/>
    <rect x="585" y="225" width="145" height="18" rx="4" fill="#DBEAFE"/>
    <text x="590" y="238" class="branch-tag" fill="#2563EB">PHỤC HỒI 2 (GỢI Ý)</text>

    <rect x="645" y="190" width="200" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="657" y="215" class="node-text" fill="#2563EB">Chọn Track gợi ý</text>
    <text x="657" y="233" class="node-sub">"AI &amp; LLM Tutoring" (14 proposals)</text>

    <path d="M 845 220 L 885 220" class="arrow-blue"/>
    <rect x="895" y="190" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="907" y="215" class="node-text">Khám phá EduConnect</text>
    <text x="907" y="233" class="node-sub">Dự án tương đương về công nghệ</text>

    <path d="M 1095 220 L 1135 220" class="arrow-blue"/>
    <rect x="1145" y="190" width="175" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="1157" y="215" class="node-text" fill="#2563EB">[KẾT THÚC PHỤC HỒI 2]</text>
    <text x="1157" y="233" class="node-sub">Quay lại luồng Flow 1</text>
  </g>
</svg>
