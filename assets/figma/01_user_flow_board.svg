<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1020" width="1440" height="1020">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .header-title { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; fill: #0F172A; }
      .header-sub { font-family: 'Inter', sans-serif; font-size: 13px; fill: #64748B; }
      .flow-title { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; fill: #1E293B; }
      .flow-meta { font-family: 'Inter', sans-serif; font-size: 12px; fill: #475569; font-style: italic; }
      .node-text { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; fill: #0F172A; }
      .node-sub { font-family: 'Inter', sans-serif; font-size: 10px; fill: #64748B; }
      .decision-text { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .edge-label { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; }
      .arrow-main { stroke: #2563EB; stroke-width: 2; fill: none; marker-end: url(#ah-blue); }
      .arrow-alt { stroke: #7C3AED; stroke-width: 2; fill: none; marker-end: url(#ah-purple); }
      .arrow-succ { stroke: #16A34A; stroke-width: 2; fill: none; marker-end: url(#ah-green); }
      .arrow-err { stroke: #DC2626; stroke-width: 2; fill: none; marker-end: url(#ah-red); }
      .arrow-gray { stroke: #64748B; stroke-width: 2; fill: none; marker-end: url(#ah-gray); }
    </style>
    <marker id="ah-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB" />
    </marker>
    <marker id="ah-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7C3AED" />
    </marker>
    <marker id="ah-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16A34A" />
    </marker>
    <marker id="ah-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626" />
    </marker>
    <marker id="ah-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B" />
    </marker>
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="1020" class="bg"/>

  <!-- Page Header -->
  <text x="50" y="45" class="header-title">01. KIẾN TRÚC USER FLOWS - HỆ THỐNG EXE MATCH</text>
  <text x="50" y="68" class="header-sub">Sơ đồ điều hướng trải nghiệm người dùng: Điểm khởi đầu, Điều kiện rẽ nhánh và Trạng thái hoàn thành</text>

  <!-- ==================== FLOW 1 ==================== -->
  <g transform="translate(50, 90)">
    <rect width="1340" height="270" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="6" height="270" rx="3" fill="#2563EB"/>
    <text x="24" y="30" class="flow-title">LUỒNG 1: KHÁM PHÁ DỰ ÁN &amp; NỘP ĐƠN ỨNG TUYỂN (APPLICANT FLOW)</text>
    <text x="24" y="48" class="flow-meta">Khởi đầu: SCR-02 Feed | Luồng chính: Ứng tuyển trực tiếp | Luồng rẽ: Lưu dự án quan tâm để đối sánh sau</text>

    <!-- Start Node -->
    <rect x="24" y="110" width="180" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="36" y="133" class="node-text" fill="#2563EB">[Bắt đầu]</text>
    <text x="36" y="151" class="node-sub">SCR-02: Khám phá Feed</text>

    <path d="M 204 138 L 244 138" class="arrow-main"/>

    <!-- Screen Detail -->
    <rect x="254" y="110" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="266" y="133" class="node-text">Xem chi tiết dự án</text>
    <text x="266" y="151" class="node-sub">SCR-04: Đọc Tech Stack &amp; Sĩ số</text>

    <path d="M 444 138 L 484 138" class="arrow-main"/>

    <!-- Decision Diamond -->
    <polygon points="545,110 605,138 545,166 485,138" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <text x="545" y="135" class="decision-text">Nhu cầu</text>
    <text x="545" y="148" class="decision-text">ứng viên?</text>

    <!-- Branch A: Direct Application (Top) -->
    <path d="M 545 110 L 545 90 L 640 90" class="arrow-main"/>
    <text x="555" y="82" class="edge-label" fill="#2563EB">Ứng tuyển ngay →</text>

    <rect x="650" y="62" width="205" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="662" y="85" class="node-text" fill="#1D4ED8">Điền thông tin ứng tuyển</text>
    <text x="662" y="103" class="node-sub">SCR-06: Chọn Role &amp; gửi Pitch</text>

    <path d="M 855 90 L 895 90" class="arrow-main"/>
    <rect x="905" y="62" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="917" y="85" class="node-text">Nộp đơn thành công</text>
    <text x="917" y="103" class="node-sub">SCR-04: Hiển thị mã đơn #7842</text>

    <path d="M 1105 90 L 1145 90" class="arrow-main"/>
    <rect x="1155" y="62" width="165" height="56" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="1167" y="85" class="node-text" fill="#16A34A">[Hoàn thành]</text>
    <text x="1167" y="103" class="node-sub">SCR-07: Đơn chờ duyệt</text>

    <!-- Branch B: Bookmark for later (Bottom) -->
    <path d="M 545 166 L 545 200 L 640 200" class="arrow-alt"/>
    <text x="555" y="215" class="edge-label" fill="#7C3AED">Lưu xem sau ↓</text>

    <rect x="650" y="172" width="205" height="56" rx="8" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="662" y="195" class="node-text" fill="#7C3AED">Chạm icon Bookmark</text>
    <text x="662" y="213" class="node-sub">Lưu vào mục quan tâm</text>

    <path d="M 855 200 L 895 200" class="arrow-alt"/>
    <rect x="905" y="172" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="917" y="195" class="node-text">Thông báo xác nhận</text>
    <text x="917" y="213" class="node-sub">Toast: Đã lưu vào danh sách</text>

    <path d="M 1105 200 L 1145 200" class="arrow-alt"/>
    <rect x="1155" y="172" width="165" height="56" rx="8" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="1167" y="195" class="node-text" fill="#7C3AED">[Hoàn thành]</text>
    <text x="1167" y="213" class="node-sub">Lưu trong Saved Ventures</text>
  </g>

  <!-- ==================== FLOW 2 ==================== -->
  <g transform="translate(50, 390)">
    <rect width="1340" height="270" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="6" height="270" rx="3" fill="#0D9488"/>
    <text x="24" y="30" class="flow-title">LUỒNG 2: TIẾP NHẬN HỒ SƠ &amp; PHÊ DUYỆT THÀNH VIÊN (LEADER REVIEW FLOW)</text>
    <text x="24" y="48" class="flow-meta">Khởi đầu: SCR-09 Thông báo | Luồng chính: Phê duyệt kết nạp | Luồng rẽ: Từ chối lịch sự &amp; lưu hồ sơ dự phòng</text>

    <!-- Start Node -->
    <rect x="24" y="110" width="180" height="56" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
    <text x="36" y="133" class="node-text" fill="#0D9488">[Bắt đầu]</text>
    <text x="36" y="151" class="node-sub">SCR-09: Thông báo hồ sơ mới</text>

    <path d="M 204 138 L 244 138" class="arrow-gray"/>

    <!-- Screen Profile -->
    <rect x="254" y="110" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="266" y="133" class="node-text">Đánh giá năng lực ứng viên</text>
    <text x="266" y="151" class="node-sub">SCR-05: Xem GitHub, CV &amp; Commit</text>

    <path d="M 444 138 L 484 138" class="arrow-gray"/>

    <!-- Decision Diamond -->
    <polygon points="545,110 605,138 545,166 485,138" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <text x="545" y="135" class="decision-text">Kết quả</text>
    <text x="545" y="148" class="decision-text">đánh giá?</text>

    <!-- Branch A: Accept (Top) -->
    <path d="M 545 110 L 545 90 L 640 90" class="arrow-succ"/>
    <text x="555" y="82" class="edge-label" fill="#16A34A">Hồ sơ đạt chuẩn →</text>

    <rect x="650" y="62" width="205" height="56" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="662" y="85" class="node-text" fill="#16A34A">Chấp nhận ứng tuyển</text>
    <text x="662" y="103" class="node-sub">Bấm 'Chấp nhận kết nạp'</text>

    <path d="M 855 90 L 895 90" class="arrow-succ"/>
    <rect x="905" y="62" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
    <text x="917" y="85" class="node-text">Xác nhận Dialog</text>
    <text x="917" y="103" class="node-sub">Hệ thống cập nhật sĩ số 4/5</text>

    <path d="M 1105 90 L 1145 90" class="arrow-succ"/>
    <rect x="1155" y="62" width="165" height="56" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="1167" y="85" class="node-text" fill="#16A34A">[Hoàn thành]</text>
    <text x="1167" y="103" class="node-sub">SCR-08: Thành viên chính thức</text>

    <!-- Branch B: Reject & Talent Pool (Bottom) -->
    <path d="M 545 166 L 545 200 L 640 200" class="arrow-gray"/>
    <text x="555" y="215" class="edge-label" fill="#475569">Chưa phù hợp đề tài ↓</text>

    <rect x="650" y="172" width="205" height="56" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="662" y="195" class="node-text" fill="#475569">Từ chối ứng tuyển</text>
    <text x="662" y="213" class="node-sub">Chọn lý do &amp; gửi phản hồi lịch sự</text>

    <path d="M 855 200 L 895 200" class="arrow-gray"/>
    <rect x="905" y="172" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="917" y="195" class="node-text">Lưu hồ sơ dự phòng</text>
    <text x="917" y="213" class="node-sub">Chuyển vào Talent Pool</text>

    <path d="M 1105 200 L 1145 200" class="arrow-gray"/>
    <rect x="1155" y="172" width="165" height="56" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
    <text x="1167" y="195" class="node-text" fill="#475569">[Hoàn thành]</text>
    <text x="1167" y="213" class="node-sub">Đóng hồ sơ ứng tuyển</text>
  </g>

  <!-- ==================== FLOW 3 ==================== -->
  <g transform="translate(50, 690)">
    <rect width="1340" height="290" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="6" height="290" rx="3" fill="#DC2626"/>
    <text x="24" y="30" class="flow-title">LUỒNG 3: XỬ LÝ TÌM KIẾM RỖNG &amp; ĐIỀU HƯỚNG PHỤC HỒI (SEARCH RECOVERY FLOW)</text>
    <text x="24" y="48" class="flow-meta">Khởi đầu: SCR-02 Feed | Tình huống: Không tìm thấy kết quả phù hợp | 2 Hướng phục hồi tương tác</text>

    <!-- Start Node -->
    <rect x="24" y="115" width="200" height="56" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="36" y="138" class="node-text" fill="#DC2626">[Bắt đầu]</text>
    <text x="36" y="156" class="node-sub">SCR-02: Lọc từ khóa quá hẹp</text>

    <path d="M 224 143 L 264 143" class="arrow-err"/>

    <!-- Empty State Screen -->
    <rect x="274" y="110" width="240" height="66" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="286" y="133" class="node-text" fill="#991B1B">SCR-08: Màn hình Empty State</text>
    <text x="286" y="151" class="node-sub">"Không tìm thấy dự án phù hợp"</text>
    <text x="286" y="166" font-family="'Inter'" font-size="9px" fill="#DC2626">Cung cấp nút Reset &amp; Danh mục gợi ý</text>

    <!-- Branch A: Reset Filters (Top) -->
    <path d="M 514 130 L 570 130 L 570 90 L 640 90" class="arrow-succ"/>
    <text x="525" y="82" class="edge-label" fill="#16A34A">Thao tác 'Reset Filters' →</text>

    <rect x="650" y="62" width="205" height="56" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="662" y="85" class="node-text" fill="#16A34A">Đặt lại bộ lọc tìm kiếm</text>
    <text x="662" y="103" class="node-sub">Xóa toàn bộ tiêu chí lọc về mặc định</text>

    <path d="M 855 90 L 895 90" class="arrow-succ"/>
    <rect x="905" y="62" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
    <text x="917" y="85" class="node-text">Tải lại danh sách mở</text>
    <text x="917" y="103" class="node-sub">SCR-02: Hiển thị 18 dự án sẵn có</text>

    <path d="M 1105 90 L 1145 90" class="arrow-succ"/>
    <rect x="1155" y="62" width="165" height="56" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="1167" y="85" class="node-text" fill="#16A34A">[Hoàn thành]</text>
    <text x="1167" y="103" class="node-sub">Tiếp tục duyệt feed</text>

    <!-- Branch B: Explore Suggestions (Bottom) -->
    <path d="M 514 155 L 570 155 L 570 200 L 640 200" class="arrow-main"/>
    <text x="525" y="215" class="edge-label" fill="#2563EB">Chọn danh mục gợi ý ↓</text>

    <rect x="650" y="172" width="205" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="662" y="195" class="node-text" fill="#2563EB">Khám phá Track đề xuất</text>
    <text x="662" y="213" class="node-sub">Chọn lĩnh vực 'AI &amp; LLM Tutoring'</text>

    <path d="M 855 200 L 895 200" class="arrow-main"/>
    <rect x="905" y="172" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="917" y="195" class="node-text">Mở nhóm tương đương</text>
    <text x="917" y="213" class="node-sub">SCR-04: Chi tiết nhóm EduConnect</text>

    <path d="M 1105 200 L 1145 200" class="arrow-main"/>
    <rect x="1155" y="172" width="165" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="1167" y="195" class="node-text" fill="#2563EB">[Hoàn thành]</text>
    <text x="1167" y="213" class="node-sub">Tiếp tục luồng ứng tuyển</text>
  </g>
</svg>
